# Fly.io app config for the Peritus API + build worker.
# Deployed by .github/workflows/deploy.yml on every push to main.

app = "peritus"
primary_region = "iad"

[build]

[processes]
  app = "peritus-server"
  worker = "peritus-worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  processes = ["worker"]
