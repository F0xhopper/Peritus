[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peritus"
version = "2.0.0"
description = "Search beyond the database export, and keep a defensible record of every source considered."
requires-python = ">=3.12"
dependencies = [
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",

    # Database
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",

    # AI
    "openai>=1.54.0",
    "anthropic>=0.40.0",

    # Auth — verify Supabase access tokens (JWKS/ES256/RS256 + HS256 fallback)
    "pyjwt[crypto]>=2.9.0",

    # Source fetchers
    "youtube-transcript-api>=0.6.0",
    "exa-py>=1.0.0",
    "arxiv>=2.1.0",

    # HTTP + HTML parsing
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Config / utils
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # multipart/form-data parsing — required by FastAPI for the source-upload
    # endpoint; FastAPI raises at import time without it.
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "faker>=30.0.0",
]

[project.scripts]
peritus = "peritus.cli.main:main"
peritus-server = "peritus.api.app:start"
peritus-worker = "peritus.jobs.runner:worker_main"

[tool.hatch.build.targets.wheel]
packages = ["src/peritus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",         # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # returns
    "PT",        # pytest style
    "RUF",       # ruff's own
    "ASYNC",     # blocking calls in async functions
    "PLW",       # pylint warnings
    "PLR0402",   # `import x.y as y` → `from x import y`
    "PLR1714",   # `a == b or a == c` → `a in (b, c)`
    # Complexity, as a ratchet rather than a standard: the thresholds below are
    # set one notch above today's worst offender so nothing can get *worse*, and
    # they come down as the builder split (cleanup plan, Phase 5) lands.
    "C901",      # cyclomatic complexity
    "PLR0911",   # too many returns
    "PLR0912",   # too many branches
    "PLR0913",   # too many arguments
    "PLR0915",   # too many statements
]
ignore = [
    "B008",      # FastAPI's Depends() in a default is the framework's own idiom.
    # The prose in this codebase uses real typography — en dashes, curly
    # quotes, × — in docstrings, comments and user-facing strings. That is
    # deliberate, and these three rules flag every instance of it.
    "RUF001",
    "RUF002",
    "RUF003",
    # `assert a and b` reads better than two asserts in most of these tests,
    # and pytest's failure output is adequate either way.
    "PT018",
    # Module-level singletons (the pool, the settings, the HTTP client) are
    # initialised through `global` by design; see infrastructure/database.py.
    "PLW0603",
    # A `timeout` parameter on an async function is how the fetchers expose
    # per-source budgets; the rule wants a cancel scope instead.
    "ASYNC109",
    # `for x in xs: x = x.strip()` — normalising the loop variable in place is
    # the idiom this codebase uses, and renaming six of them reads worse.
    "PLW2901",
]

[tool.ruff.lint.mccabe]
# Worst in src today: 25. Lower this as Phase 5 splits the builder.
max-complexity = 25

[tool.ruff.lint.pylint]
# Same ratchet. Worst today: 7 returns, 21 branches, 13 arguments,
# 102 statements (`ExpertBuilder._run_discovery`).
max-returns = 7
max-branches = 21
max-args = 13
max-statements = 102

[tool.ruff.lint.pycodestyle]
# The formatter targets line-length (100); E501 only fires on egregious lines.
max-line-length = 120

[tool.mypy]
python_version = "3.12"
# Not `strict`: the codebase predates annotations in places. These flags catch the
# high-value errors (wrong types, bad calls, unreachable code) without demanding
# full annotation coverage. Tighten towards strict as annotations are added.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/peritus"]
omit = ["*/migrations/*"]
