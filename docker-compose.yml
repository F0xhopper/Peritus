services:
  api:
    build: ./api
    command: peritus-server
    ports:
      - "8000:8000"
    env_file: api/.env
    restart: unless-stopped

  # Builds run in this separate process so an API restart/deploy never kills an
  # in-flight build. Scale with `docker compose up --scale worker=N`.
  worker:
    build: ./api
    command: peritus-worker
    env_file: api/.env
    restart: unless-stopped
