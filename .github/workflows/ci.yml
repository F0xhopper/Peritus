name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    # The DB-backed tests (job queue claim/heartbeat/reap, conversation
    # persistence, credit arithmetic, expert visibility, source uploads) skip
    # themselves when PERITUS_TEST_DATABASE_URL is unset. Without this service
    # they skipped in CI too — 54 written tests, including every billing test,
    # reporting green while never having run. pgvector's image is required, not
    # plain postgres: the schema declares vector columns.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peritus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peritus_test
      PERITUS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peritus_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev tools
        run: pip install "./api[dev]"

      - name: Lint
        working-directory: api
        run: ruff check src tests

      # `just lint` runs ruff *and* mypy; CI ran only ruff, and the type errors
      # that accumulated behind that gap included two real bugs.
      - name: Typecheck
        working-directory: api
        run: mypy src

      # Also exercises the migration runner itself on every push, which is the
      # thing the deploy release_command now depends on.
      - name: Apply migrations
        working-directory: api
        run: python migrations/apply.py

      - name: Test
        working-directory: api
        run: python -m pytest

      - name: Smoke-check the installed CLI
        run: peritus --help

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npx eslint .

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # The unit suite covers the SSE frame parser, the build-event reducer, the
      # proxy's refresh-once and dead-refresh paths, cookie shaping, and the
      # avatar resolver. The fixture tests are the schema check: there is no
      # codegen between the Python schemas and `lib/api/types.ts`, so a payload
      # that drifts fails here rather than in a user's browser.
      - name: Unit tests
        working-directory: web
        run: npx vitest run

      - name: Build
        working-directory: web
        run: npx next build

  web-e2e:
    name: Web end to end
    runs-on: ubuntu-latest
    # The build is the artefact under test, so this waits for the job that
    # proves it compiles rather than racing it.
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Turbopack's build cache lives here; restoring it is the difference
      # between a warm and a cold build (see turbopackFileSystemCacheForBuild).
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        working-directory: web
        run: npx next build

      # Seven projects — desktop, laptop, two iPads, iPhone, Pixel, and a
      # reduced-motion pass — against the mock API in `e2e/mock-api`, which
      # serves the captured fixtures and streams real SSE with real `id:`
      # cursors. A real build costs money and takes minutes, so it can never be
      # what CI runs against. `playwright.config.ts` starts both servers.
      - name: End-to-end
        working-directory: web
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  web-lighthouse:
    name: Web performance budgets
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Build
        working-directory: web
        run: npx next build

      # web-design.md §9: LCP under 2.5s, CLS under 0.1, and TBT under 200ms as
      # the lab stand-in for INP. `scripts/lighthouse.mjs` audits the public
      # pages without a session and the app pages with one, three runs each,
      # asserting the median — and it uses **devtools throttling, not the
      # simulated default**: Lantern charges a streamed document's whole
      # transfer to the element that arrives last in it, which reported 2.9s for
      # a landing-page paragraph that a really-throttled Chrome paints at 0.85s.
      - name: Lighthouse
        working-directory: web
        run: npm run lighthouse

      - name: Upload the reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          retention-days: 7

  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check
        working-directory: cli
        run: cargo check --locked
