name: CI

# Runs on every pull request, and is called by deploy.yml on every push to main
# so that nothing reaches production without passing it. There is deliberately
# no `push: main` trigger here: it would run the same suite twice per merge.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the *caller's* name when this runs via workflow_call,
  # so a deploy's CI never shares a group with a pull request's.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    # The DB-backed tests (job queue claim/heartbeat/reap, conversation
    # persistence, credit arithmetic, expert visibility, source uploads) skip
    # themselves when PERITUS_TEST_DATABASE_URL is unset. Without this service
    # they skipped in CI too — 54 written tests, including every billing test,
    # reporting green while never having run. pgvector's image is required, not
    # plain postgres: the schema declares vector columns.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peritus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peritus_test
      PERITUS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peritus_test
      UV_PYTHON: "3.12"

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # `--frozen` installs exactly uv.lock — the same set the Docker image
      # ships — and `lock --check` fails if pyproject.toml changed without the
      # lock being regenerated (`uv lock` in api/).
      - name: Install package with dev tools
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check src tests

      # `just lint` runs ruff *and* mypy; CI ran only ruff, and the type errors
      # that accumulated behind that gap included two real bugs.
      - name: Typecheck
        run: uv run --frozen mypy src

      # Also exercises the migration runner itself on every push, which is the
      # thing the deploy release_command depends on.
      - name: Apply migrations
        run: uv run --frozen python migrations/apply.py

      - name: Test
        run: uv run --frozen python -m pytest

      - name: Smoke-check the installed CLI
        run: uv run --frozen peritus --help

  # The unit suite runs against a virtualenv; production runs a container. This
  # builds that exact image and runs it the way Fly does — release_command
  # migrations, then the API and the worker — so a broken Dockerfile, a missing
  # runtime file or a dependency that only fails without dev tools is caught
  # here rather than by a failed release.
  api-image:
    name: API image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peritus
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: api
          load: true
          tags: peritus-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      - name: Run it as Fly does
        run: |
          set -euo pipefail
          run=(docker run --network host
               -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/peritus
               -e OPENAI_API_KEY=ci -e ANTHROPIC_API_KEY=ci)

          # release_command, twice: the second run must be a no-op.
          "${run[@]}" --rm peritus-api:ci python migrations/apply.py
          "${run[@]}" --rm peritus-api:ci python migrations/apply.py | tail -1

          "${run[@]}" -d --name api peritus-api:ci
          "${run[@]}" -d --name worker peritus-api:ci peritus-worker

          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          docker exec api peritus --help > /dev/null

          # Fly sends SIGTERM on every deploy; the worker must drain and exit 0
          # inside fly.toml's kill_timeout rather than be killed mid-build.
          docker stop --time 30 worker
          test "$(docker inspect worker --format '{{.State.ExitCode}}')" = 0

      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      # The unit suite covers the SSE frame parser, the build-event reducer, the
      # proxy's refresh-once and dead-refresh paths, cookie shaping, and the
      # avatar resolver. The fixture tests are the schema check: there is no
      # codegen between the Python schemas and `lib/api/types.ts`, so a payload
      # that drifts fails here rather than in a user's browser.
      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

  web-e2e:
    name: Web end to end
    runs-on: ubuntu-latest
    # The build is the artefact under test, so this waits for the job that
    # proves it compiles rather than racing it.
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Turbopack's build cache lives here; restoring it is the difference
      # between a warm and a cold build (see turbopackFileSystemCacheForBuild).
      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npx next build

      # Seven projects — desktop, laptop, two iPads, iPhone, Pixel, and a
      # reduced-motion pass — against the mock API in `e2e/mock-api`, which
      # serves the captured fixtures and streams real SSE with real `id:`
      # cursors. A real build costs money and takes minutes, so it can never be
      # what CI runs against. `playwright.config.ts` starts both servers.
      - name: End-to-end
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  web-lighthouse:
    name: Web performance budgets
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Build
        run: npx next build

      # web-design.md §9: LCP under 2.5s, CLS under 0.1, and TBT under 200ms as
      # the lab stand-in for INP. `scripts/lighthouse.mjs` audits the public
      # pages without a session and the app pages with one, three runs each,
      # asserting the median — and it uses **devtools throttling, not the
      # simulated default**: Lantern charges a streamed document's whole
      # transfer to the element that arrives last in it, which reported 2.9s for
      # a landing-page paragraph that a really-throttled Chrome paints at 0.85s.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload the reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          retention-days: 7

  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check
        working-directory: cli
        run: cargo check --locked
