name: Preview

# A Vercel preview deployment of the web app for every pull request that touches
# web/, with its URL commented on the PR. It runs beside CI, not after it: a
# preview is for looking at, and production is gated in deploy.yml.
#
# Previews talk to the production API (there is one backend), so they sign in
# with real accounts and show real data. Email-code sign-in works on them;
# Google sign-in does not, because NEXT_PUBLIC_APP_URL is production's origin
# (web/docs/deploy.md explains why it is never derived from the request).
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/preview.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-web-preview:
    name: Deploy web preview (Vercel)
    # Pull requests from forks get no secrets; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the Vercel CLI
        run: npm install --global vercel@59.17.0

      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Comment the URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "**Web preview:** $URL (commit ${HEAD_SHA::7})"
